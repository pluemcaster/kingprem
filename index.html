<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcumus Clone</title>

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for in-browser JSX parsing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- KaTeX for Math -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body { background-color: #ffffff; }
        .loader { border: 3px solid #e5e7eb; border-top: 3px solid #1e40af; border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; display: inline-block; }
        .loader-white { border: 2.5px solid rgba(255,255,255,0.35); border-top: 2.5px solid #ffffff; border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // =============================================
        // CONFIGURATION — Replace these with your Supabase project values
        // =============================================
        const SUPABASE_URL = 'https://ogrgusjofekgfvcfwyqs.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ncmd1c2pvZmVrZ2Z2Y2Z3eXFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MDYyNTAsImV4cCI6MjEwNDA4MjI1MH0.72VhqePWbwqaa2ZEB-11e2ejU8zOtdjVGTWsVf6HHqY';

        const { createClient } = window.supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);


        // =============================================
        // UTILITY: Render LaTeX math inside text
        // =============================================
        const MathText = ({ text }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current && text) {
                    const parts = text.split(/\\\(|\\\)/);
                    let html = "";
                    parts.forEach((part, index) => {
                        if (index % 2 === 1) {
                            try { html += katex.renderToString(part, { throwOnError: false }); }
                            catch (e) { html += part; }
                        } else { html += part; }
                    });
                    containerRef.current.innerHTML = html;
                }
            }, [text]);
            return <span ref={containerRef}></span>;
        };

        // Small loading spinners
        const Spinner = () => <span className="loader"></span>;
        const SpinnerWhite = () => <span className="loader-white"></span>;

        // Icon Components
        const MailIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h15A1.5 1.5 0 0 1 21 6.5v11A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5v-11Z"/><path d="m3.5 6 8 6.5 8-6.5"/></svg>
        );
        const LockIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="1.8"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        );
        const UserIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20a7.5 7.5 0 0 1 15 0"/></svg>
        );
        const EyeIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
        );
        const EyeOffIcon = () => (
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.24 4.24"/><path d="M6.6 6.6C4.4 8 3 10 2 12c0 0 3.6 7 10 7 1.8 0 3.4-.4 4.8-1.1M17.4 17.4C19.4 16 21 14 22 12c0 0-1-2-3-3.9"/></svg>
        );
        const CheckCircleIcon = ({ className }) => (
            <svg className={className} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 5-5"/></svg>
        );
        const XCircleIcon = ({ className }) => (
            <svg className={className} width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/></svg>
        );
        const BrandMarkIcon = ({ className }) => (
            <svg className={className} width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16"/><path d="M4 4l7 8-7 8"/><path d="M20 4l-7 8 7 8"/></svg>
        );
        const BookIcon = ({ className }) => (
            <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/></svg>
        );
        const SparkIcon = ({ className }) => (
            <svg className={className} width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2c.6 3.6 1.9 5.6 5 7-3.1 1.4-4.4 3.4-5 7-.6-3.6-1.9-5.6-5-7 3.1-1.4 4.4-3.4 5-7Z"/></svg>
        );
        const FlagIcon = ({ className }) => (
            <svg className={className} width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M5 3v18"/><path d="M5 4h11l-2.5 4L16 12H5"/></svg>
        );
        const PencilIcon = ({ className }) => (
            <svg className={className} width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="m16.5 3.5 4 4L8 20H4v-4Z"/></svg>
        );
        const ArrowRightIcon = ({ className }) => (
            <svg className={className} width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        );
        const LightbulbIcon = ({ className }) => (
            <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.6.6 1 1.4 1 2.5h6c0-1.1.4-1.9 1-2.5A6 6 0 0 0 12 3Z"/></svg>
        );
        const InfoIcon = ({ className }) => (
            <svg className={className} width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 8h.01"/></svg>
        );

        // =============================================
        // SETUP PAGE
        // =============================================
        const SetupPage = () => (
            <div className="max-w-2xl mx-auto mt-20 p-8 border-2 border-blue-800 rounded">
                <h1 className="text-3xl font-bold text-blue-900 mb-6">⚙️ Setup Required</h1>
                <p className="text-lg mb-4">You need to connect this app to Supabase. Follow these steps:</p>
                <ol className="list-decimal ml-6 space-y-3 text-gray-700">
                    <li>Go to <a href="https://supabase.com" target="_blank" className="text-blue-600 underline">supabase.com</a> and create a free account</li>
                    <li>Click <strong>"New Project"</strong></li>
                    <li>Go to <strong>SQL Editor</strong> → paste and run the contents of <code>supabase-setup.sql</code></li>
                    <li>Go to <strong>Settings → API</strong> and copy your <strong>Project URL</strong> and <strong>anon key</strong></li>
                    <li>Open <code>index.html</code> and replace <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code></li>
                    <li>Refresh this page — done!</li>
                </ol>
            </div>
        );

        // =============================================
        // AUTH PAGE
        // =============================================
        const AuthPage = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [name, setName] = useState('');
            const [showPassword, setShowPassword] = useState(false);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');
            const [message, setMessage] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setMessage('');
                if (!isLogin && password !== confirmPassword) {
                    setError("Passwords don't match.");
                    return;
                }
                setLoading(true);
                if (isLogin) {
                    const { error } = await db.auth.signInWithPassword({ email, password });
                    if (error) setError(error.message);
                } else {
                    const { data, error } = await db.auth.signUp({
                        email, password, options: { data: { name: name || 'New User' } }
                    });
                    if (error) setError(error.message);
                    else if (data.user && !data.session) setMessage('Check email for confirmation link.');
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gray-50 p-6">
                    <div className="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
                        <div className="flex items-center gap-3 mb-8 justify-center">
                            <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-200">
                                <BrandMarkIcon className="text-white" />
                            </div>
                            <h1 className="text-2xl font-black text-blue-900">Alcumus Clone</h1>
                        </div>
                        <div className="flex border-b mb-6">
                            <button onClick={() => setIsLogin(true)} className={`flex-1 pb-3 font-bold transition-colors ${isLogin ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}>Log In</button>
                            <button onClick={() => setIsLogin(false)} className={`flex-1 pb-3 font-bold transition-colors ${!isLogin ? 'text-blue-600 border-b-2 border-blue-600' : 'text-gray-400'}`}>Sign Up</button>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            {!isLogin && (
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Name</label>
                                    <input type="text" value={name} onChange={(e) => setName(e.target.value)} className="w-full border-2 border-gray-200 p-3 rounded-lg outline-none focus:border-blue-500" required />
                                </div>
                            )}
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">Email</label>
                                <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full border-2 border-gray-200 p-3 rounded-lg outline-none focus:border-blue-500" required />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">Password</label>
                                <input type={showPassword ? 'text' : 'password'} value={password} onChange={(e) => setPassword(e.target.value)} className="w-full border-2 border-gray-200 p-3 rounded-lg outline-none focus:border-blue-500" required />
                            </div>
                            {!isLogin && (
                                <div>
                                    <label className="block text-sm font-bold text-gray-700 mb-1">Confirm Password</label>
                                    <input type="password" value={confirmPassword} onChange={(e) => setConfirmPassword(e.target.value)} className="w-full border-2 border-gray-200 p-3 rounded-lg outline-none focus:border-blue-500" required />
                                </div>
                            )}
                            {error && <p className="text-red-500 text-sm font-medium">{error}</p>}
                            {message && <p className="text-green-500 text-sm font-medium">{message}</p>}
                            <button type="submit" disabled={loading} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-100 flex items-center justify-center gap-2">
                                {loading ? <SpinnerWhite /> : (isLogin ? 'LOG IN' : 'CREATE ACCOUNT')}
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // =============================================
        // MAIN VIEWS
        // =============================================
        const HomeView = ({ stats, userProfile, subjects, onPlay }) => {
            const levels = {};
            subjects.forEach(s => {
                if (!levels[s.level]) levels[s.level] = [];
                levels[s.level].push(s);
            });

            return (
                <div className="space-y-8">
                    <div className="bg-white p-8 rounded-2xl border border-gray-100 shadow-sm flex flex-col md:flex-row justify-between items-center gap-6">
                        <div className="text-center md:text-left">
                            <h2 className="text-3xl font-black text-blue-900 mb-2">Welcome back, {userProfile.name.split(' ')[0]}! 👋</h2>
                            <p className="text-gray-500 font-medium">Ready to master more math today?</p>
                        </div>
                        <div className="flex gap-4">
                            <div className="px-6 py-4 bg-blue-50 rounded-2xl text-center min-w-[120px]">
                                <p className="text-xs font-bold text-blue-400 uppercase tracking-widest mb-1">Solved</p>
                                <p className="text-2xl font-black text-blue-900">{stats.solved}</p>
                            </div>
                            <div className="px-6 py-4 bg-orange-50 rounded-2xl text-center min-w-[120px]">
                                <p className="text-xs font-bold text-orange-400 uppercase tracking-widest mb-1">Accuracy</p>
                                <p className="text-2xl font-black text-orange-600">{stats.attempts > 0 ? Math.round((stats.solved / stats.attempts) * 100) : 0}%</p>
                            </div>
                        </div>
                    </div>
                    {Object.entries(levels).map(([level, subs]) => (
                        <div key={level}>
                            <h3 className="text-xl font-black text-gray-800 mb-6 flex items-center gap-3">
                                {level} <div className="h-[2px] flex-1 bg-gray-100"></div>
                            </h3>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {subs.map(s => (
                                    <button key={s.id} onClick={() => onPlay(s)} className="group p-6 bg-white border border-gray-200 rounded-2xl text-left hover:border-blue-500 hover:shadow-xl hover:shadow-blue-100 transition-all duration-300">
                                        <div className="w-12 h-12 rounded-xl bg-gray-50 flex items-center justify-center mb-4 group-hover:bg-blue-50 transition-colors">
                                            <BookIcon className="text-gray-400 group-hover:text-blue-500" />
                                        </div>
                                        <p className="text-lg font-bold text-gray-800 group-hover:text-blue-900 transition-colors">{s.name}</p>
                                        <p className="text-sm text-gray-400 mt-1">Click to practice</p>
                                    </button>
                                ))}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };

        const PlayView = ({ session, subject, subjects, topicFilter, onSelectSubject, onClearTopic, onStatsChange }) => {
            const [currentProblem, setCurrentProblem] = useState(null);
            const [userAnswer, setUserAnswer] = useState('');
            const [status, setStatus] = useState('idle');
            const [loading, setLoading] = useState(false);
            const [streak, setStreak] = useState(0);

            const fetchProblem = useCallback(async () => {
                setLoading(true); setStatus('idle'); setUserAnswer('');
                const { data: solved } = await db.from('user_progress').select('problem_id').eq('user_id', session.user.id).eq('is_correct', true);
                const solvedIds = new Set(solved.map(s => s.problem_id));
                let query = db.from('problems').select('*');
                if (subject) query = query.eq('subject_id', subject.id);
                if (topicFilter) query = query.eq('topic_id', topicFilter.id);
                const { data: all } = await query;
                if (!all || all.length === 0) { setCurrentProblem(null); setLoading(false); return; }
                const unsolved = all.filter(p => !solvedIds.has(p.id));
                const pool = unsolved.length > 0 ? unsolved : all;
                setCurrentProblem(pool[Math.floor(Math.random() * pool.length)]);
                setLoading(false);
            }, [session, subject, topicFilter]);

            useEffect(() => { fetchProblem(); }, [fetchProblem]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (status === 'correct' || !currentProblem) return;
                const normalize = (s) => s.replace(/\s+/g, '').toLowerCase();
                const isCorrect = normalize(userAnswer) === normalize(currentProblem.answer);
                await db.from('user_progress').insert({ user_id: session.user.id, problem_id: currentProblem.id, is_correct: isCorrect, user_answer: userAnswer });
                setStatus(isCorrect ? 'correct' : 'incorrect');
                if (isCorrect) { setStreak(s => s + 1); onStatsChange(); } else setStreak(0);
            };

            if (loading) return <div className="flex justify-center py-20"><Spinner /></div>;
            if (!currentProblem) return <div className="text-center py-20 text-gray-400 font-bold">No problems found. Select a subject!</div>;

            return (
                <div className="max-w-3xl mx-auto space-y-6">
                    <div className="bg-white p-8 rounded-3xl border border-gray-200 shadow-sm space-y-6">
                        <div className="flex justify-between items-center border-b pb-4">
                            <div className="flex items-center gap-2 font-black text-blue-900"><BookIcon /> {subject?.name || 'Practice'}</div>
                            <div className="bg-orange-50 text-orange-600 px-3 py-1 rounded-full text-xs font-bold flex items-center gap-1"><SparkIcon /> {streak} Streak</div>
                        </div>
                        <div className="text-2xl leading-relaxed py-4"><MathText text={currentProblem.problem_text} /></div>
                        {status !== 'idle' && (
                            <div className={`p-4 rounded-xl border ${status === 'correct' ? 'bg-green-50 border-green-200 text-green-800' : 'bg-red-50 border-red-200 text-red-800'}`}>
                                <p className="font-bold flex items-center gap-2">{status === 'correct' ? <CheckCircleIcon /> : <XCircleIcon />} {status === 'correct' ? 'Correct!' : 'Incorrect, try again.'}</p>
                                {status === 'correct' && <div className="mt-4 pt-4 border-t border-green-200"><p className="font-bold mb-2">Solution:</p><MathText text={currentProblem.solution} /></div>}
                            </div>
                        )}
                        <form onSubmit={handleSubmit} className="flex flex-col sm:flex-row gap-4 items-end">
                            <div className="flex-1 w-full space-y-1.5">
                                <label className="text-xs font-black text-gray-400 uppercase tracking-widest">Answer</label>
                                <input type="text" value={userAnswer} onChange={e => setUserAnswer(e.target.value)} placeholder="Type answer..." className="w-full border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 transition-all" />
                            </div>
                            <div className="flex gap-2">
                                {status === 'correct' ? (
                                    <button type="button" onClick={fetchProblem} className="bg-blue-600 text-white font-bold px-8 py-3.5 rounded-xl hover:bg-blue-700 transition-all shadow-lg shadow-blue-100 flex items-center gap-2 text-sm uppercase tracking-widest">Next <ArrowRightIcon /></button>
                                ) : (
                                    <button type="submit" className="bg-blue-900 text-white font-bold px-8 py-3.5 rounded-xl hover:bg-black transition-all shadow-lg shadow-blue-100 text-sm uppercase tracking-widest">Submit</button>
                                )}
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const LearnView = ({ subjects, onPractice }) => {
            const [selectedSubject, setSelectedSubject] = useState(subjects[0] || null);
            const [topics, setTopics] = useState([]);
            const [loading, setLoading] = useState(false);

            useEffect(() => {
                if (!selectedSubject) return;
                const fetchTopics = async () => {
                    setLoading(true);
                    const { data } = await db.from('topics').select('*').eq('subject_id', selectedSubject.id).order('section_ref');
                    setTopics(data || []);
                    setLoading(false);
                };
                fetchTopics();
            }, [selectedSubject]);

            return (
                <div className="space-y-6">
                    <div className="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
                        {subjects.map(s => (
                            <button key={s.id} onClick={() => setSelectedSubject(s)} className={`px-4 py-2 rounded-full font-bold text-sm whitespace-nowrap transition-all ${selectedSubject?.id === s.id ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'bg-white text-gray-500 border border-gray-200 hover:border-blue-300'}`}>{s.name}</button>
                        ))}
                    </div>
                    <div className="bg-white rounded-3xl border border-gray-100 shadow-sm divide-y divide-gray-50">
                        {loading ? <div className="p-20 flex justify-center"><Spinner /></div> : (
                            topics.map(t => (
                                <div key={t.id} className="p-6 flex flex-col sm:flex-row justify-between items-center gap-4 hover:bg-blue-50/30 transition-colors group">
                                    <div>
                                        <p className="text-xs font-black text-blue-400 uppercase tracking-widest mb-1">{t.section_ref || 'Topic'}</p>
                                        <p className="text-lg font-bold text-gray-800">{t.name}</p>
                                        <p className="text-sm text-gray-400">{t.name_th}</p>
                                    </div>
                                    <button onClick={() => onPractice(t, selectedSubject.id)} className="bg-white border border-gray-200 px-6 py-2 rounded-xl font-bold text-blue-600 hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-all shadow-sm flex items-center gap-2">Practice <PencilIcon /></button>
                                </div>
                            ))
                        )}
                        {!loading && topics.length === 0 && <div className="p-20 text-center text-gray-400 font-bold">No topics found.</div>}
                    </div>
                </div>
            );
        };

        const ProfileView = ({ session, onProfileUpdate }) => {
            const [profile, setProfile] = useState(null);
            const [loading, setLoading] = useState(true);
            const [saving, setSaving] = useState(false);
            const [message, setMessage] = useState('');

            useEffect(() => {
                db.from('profiles').select('*').eq('id', session.user.id).single().then(({ data }) => {
                    setProfile(data); setLoading(false);
                });
            }, [session]);

            const handleSubmit = async (e) => {
                e.preventDefault(); setSaving(true);
                const fd = new FormData(e.target);
                const updates = { name: fd.get('name'), institute: fd.get('institute'), major: fd.get('major'), picture_url: fd.get('picture_url') };
                const { error } = await db.from('profiles').update(updates).eq('id', session.user.id);
                if (error) setMessage('Error: ' + error.message);
                else { setMessage('Profile updated!'); onProfileUpdate({ ...profile, ...updates }); }
                setSaving(false);
            };

            if (loading) return <div className="flex justify-center py-20"><Spinner /></div>;

            return (
                <div className="max-w-xl mx-auto bg-white p-8 rounded-3xl border border-gray-100 shadow-sm space-y-8">
                    <div className="flex items-center gap-6 border-b pb-8">
                        <div className="w-20 h-20 rounded-2xl bg-blue-100 flex items-center justify-center overflow-hidden border-2 border-white shadow-lg">
                            {profile.picture_url ? <img src={profile.picture_url} className="w-full h-full object-cover" /> : <UserIcon className="text-blue-500 w-10 h-10" />}
                        </div>
                        <div>
                            <h2 className="text-2xl font-black text-blue-900">{profile.name}</h2>
                            <p className="text-gray-400 font-medium">{profile.email}</p>
                        </div>
                    </div>
                    <form onSubmit={handleSubmit} className="space-y-4">
                        <div className="grid grid-cols-1 gap-4">
                            <div><label className="block text-xs font-black text-gray-400 uppercase tracking-widest mb-1.5 ml-1">Name</label><input name="name" defaultValue={profile.name} className="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                            <div><label className="block text-xs font-black text-gray-400 uppercase tracking-widest mb-1.5 ml-1">Institute</label><input name="institute" defaultValue={profile.institute} className="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                            <div><label className="block text-xs font-black text-gray-400 uppercase tracking-widest mb-1.5 ml-1">Major</label><input name="major" defaultValue={profile.major} className="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                            <div><label className="block text-xs font-black text-gray-400 uppercase tracking-widest mb-1.5 ml-1">Picture URL</label><input name="picture_url" defaultValue={profile.picture_url} className="w-full border-2 border-gray-100 p-3 rounded-xl outline-none focus:border-blue-500 transition-all" /></div>
                        </div>
                        {message && <p className={`p-3 rounded-xl text-sm font-bold ${message.includes('Error') ? 'bg-red-50 text-red-600' : 'bg-green-50 text-green-600'}`}>{message}</p>}
                        <button disabled={saving} className="w-full bg-blue-900 text-white font-bold py-4 rounded-2xl hover:bg-black transition-all shadow-lg flex justify-center items-center gap-2">{saving ? <SpinnerWhite /> : 'SAVE CHANGES'}</button>
                    </form>
                </div>
            );
        };

        // =============================================
        // MAIN APP COMPONENT
        // =============================================
        const MainApp = ({ session }) => {
            const [currentView, setCurrentView] = useState("home");
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [userProfile, setUserProfile] = useState({ name: 'Loading...', picture_url: '' });
            const [subjects, setSubjects] = useState([]);
            const [selectedSubject, setSelectedSubject] = useState(null);
            const [topicFilter, setTopicFilter] = useState(null);
            const [stats, setStats] = useState({ solved: 0, attempts: 0 });

            useEffect(() => {
                const init = async () => {
                    const [{ data: profile }, { data: subs }] = await Promise.all([
                        db.from('profiles').select('*').eq('id', session.user.id).single(),
                        db.from('subjects').select('*').order('id')
                    ]);
                    if (profile) setUserProfile(profile);
                    if (subs) setSubjects(subs);
                    refreshStats();
                };
                init();
            }, [session]);

            const refreshStats = async () => {
                const { data: progress } = await db.from('user_progress').select('problem_id, is_correct').eq('user_id', session.user.id);
                const solved = new Set((progress || []).filter(p => p.is_correct).map(p => p.problem_id));
                setStats({ solved: solved.size, attempts: progress?.length || 0 });
            };

            const navigate = (v) => { setCurrentView(v); if (window.innerWidth < 1024) setIsSidebarOpen(false); };
            const goToPlay = (s) => { setSelectedSubject(s); setTopicFilter(null); navigate('play'); };
            const goToPractice = (t, sid) => { const s = subjects.find(x => x.id === sid); setSelectedSubject(s); setTopicFilter(t); navigate('play'); };

            const NavItem = ({ view, icon: Icon, label }) => (
                <button onClick={() => navigate(view)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all group ${currentView === view ? 'bg-blue-600 text-white shadow-lg shadow-blue-100' : 'text-gray-500 hover:bg-blue-50 hover:text-blue-600'}`}>
                    <Icon className={currentView === view ? 'text-white' : 'text-gray-400 group-hover:text-blue-500'} />
                    {isSidebarOpen && <span className="font-bold text-sm tracking-tight">{label}</span>}
                </button>
            );

            return (
                <div className="flex min-h-screen bg-gray-50 font-sans text-gray-900">
                    <aside className={`fixed inset-y-0 left-0 z-50 bg-white border-r border-gray-100 transition-all duration-300 flex flex-col ${isSidebarOpen ? 'w-64' : 'w-20'}`}>
                        <div className="h-20 flex items-center px-6 border-b border-gray-50 mb-6">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-200 flex-shrink-0"><BrandMarkIcon className="text-white" /></div>
                                {isSidebarOpen && <h1 className="text-xl font-black text-blue-900">Alcumus</h1>}
                            </div>
                        </div>
                        <div className="flex-1 px-3 space-y-2">
                            <NavItem view="home" icon={BrandMarkIcon} label="Dashboard" />
                            <NavItem view="play" icon={PencilIcon} label="Practice" />
                            <NavItem view="learn" icon={BookIcon} label="Topics" />
                            <NavItem view="profile" icon={UserIcon} label="Profile" />
                        </div>
                        <div className="p-4 border-t border-gray-50">
                            <button onClick={() => navigate('profile')} className="w-full flex items-center gap-3 p-2 rounded-xl hover:bg-gray-50">
                                <div className="w-10 h-10 rounded-xl bg-blue-50 flex items-center justify-center text-blue-600 font-bold overflow-hidden">
                                    {userProfile.picture_url ? <img src={userProfile.picture_url} className="w-full h-full object-cover" /> : userProfile.name[0]}
                                </div>
                                {isSidebarOpen && <div className="flex-1 text-left"><p className="text-sm font-bold text-gray-800 truncate">{userProfile.name}</p><p className="text-[10px] text-gray-400 uppercase font-black tracking-widest">Student</p></div>}
                            </button>
                        </div>
                    </aside>
                    <main className={`flex-1 transition-all duration-300 ${isSidebarOpen ? 'lg:ml-64' : 'lg:ml-20'}`}>
                        <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 h-20 px-6 flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className="p-2 rounded-xl hover:bg-gray-100 text-gray-400 transition-all"><svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M3 12h18M3 6h18M3 18h18" /></svg></button>
                                <h2 className="text-xl font-black text-gray-800 capitalize">{currentView}</h2>
                            </div>
                            <button onClick={() => db.auth.signOut()} className="text-sm font-black text-red-500 hover:text-red-700 uppercase tracking-widest px-4 py-2 hover:bg-red-50 rounded-xl transition-all">Logout</button>
                        </header>
                        <div className="p-6 lg:p-10 max-w-6xl mx-auto">
                            {currentView === 'home' && <HomeView stats={stats} userProfile={userProfile} subjects={subjects} onPlay={goToPlay} />}
                            {currentView === 'play' && <PlayView session={session} subject={selectedSubject} subjects={subjects} topicFilter={topicFilter} onSelectSubject={setSelectedSubject} onClearTopic={() => setTopicFilter(null)} onStatsChange={refreshStats} />}
                            {currentView === 'learn' && <LearnView subjects={subjects} onPractice={goToPractice} />}
                            {currentView === 'profile' && <ProfileView session={session} onProfileUpdate={setUserProfile} />}
                        </div>
                    </main>
                </div>
            );
        };

        const App = () => {
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const isConfigured = SUPABASE_URL !== 'YOUR_SUPABASE_URL';
            useEffect(() => {
                if (!isConfigured) { setLoading(false); return; }
                db.auth.getSession().then(({ data: { session } }) => { setSession(session); setLoading(false); });
                const { data: { subscription } } = db.auth.onAuthStateChange((_e, s) => setSession(s));
                return () => subscription.unsubscribe();
            }, [isConfigured]);
            if (loading) return <div className="min-h-screen flex items-center justify-center bg-gray-50"><Spinner /></div>;
            if (!isConfigured) return <SetupPage />;
            return !session ? <AuthPage /> : <MainApp session={session} />;
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
